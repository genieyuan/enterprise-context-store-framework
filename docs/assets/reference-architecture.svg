<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="860" viewBox="0 0 1600 860" role="img" aria-labelledby="title desc">
  <title id="title">Enterprise Context Store reference architecture</title>
  <desc id="desc">A left-to-right flow from enterprise signals through capture, evidence, topics, graph scopes/routes/IDs, vector permitted evidence content, agent context service, and AI agents, with authoritative systems of record, accepted governed feedback, and dashed candidate episode projections.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,3 L0,6 Z" fill="#334155"/></marker>
    <marker id="arrow-dashed" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,3 L0,6 Z" fill="#7c3aed"/></marker>
    <style>
      .box{stroke:#334155;stroke-width:2;rx:14} .main{fill:#e0f2fe} .store{fill:#dcfce7} .service{fill:#fef3c7} .agent{fill:#fce7f3} .authority{fill:#f1f5f9} .candidate{fill:#f5f3ff;stroke:#7c3aed;stroke-dasharray:9 7}
      .label{font:600 21px sans-serif;fill:#0f172a} .small{font:16px sans-serif;fill:#334155} .note{font:15px sans-serif;fill:#475569} .line{stroke:#334155;stroke-width:3;fill:none;marker-end:url(#arrow)} .dashed{stroke:#7c3aed;stroke-width:2.5;stroke-dasharray:10 8;fill:none;marker-end:url(#arrow-dashed)}
    </style>
  </defs>
  <rect width="1600" height="860" fill="#ffffff"/>
  <text x="60" y="55" class="label">Enterprise Context Store — reference architecture</text>
  <text x="60" y="84" class="note">Accepted canonical unit: Topic · candidate projections are visibly dashed · governed feedback is accepted</text>

  <rect x="55" y="180" width="180" height="105" class="box main"/>
  <text x="145" y="220" text-anchor="middle" class="label">Enterprise</text><text x="145" y="248" text-anchor="middle" class="label">signals</text>
  <text x="145" y="272" text-anchor="middle" class="small">internal + external</text>

  <rect x="285" y="180" width="190" height="105" class="box main"/>
  <text x="380" y="220" text-anchor="middle" class="label">Capture &amp;</text><text x="380" y="248" text-anchor="middle" class="label">normalization</text>
  <text x="380" y="272" text-anchor="middle" class="small">source identity retained</text>

  <rect x="525" y="180" width="190" height="105" class="box store"/>
  <text x="620" y="220" text-anchor="middle" class="label">Raw evidence</text><text x="620" y="248" text-anchor="middle" class="label">ledger</text>
  <text x="620" y="272" text-anchor="middle" class="small">append-only history</text>

  <rect x="765" y="180" width="190" height="105" class="box store"/>
  <text x="860" y="220" text-anchor="middle" class="label">Canonical</text><text x="860" y="248" text-anchor="middle" class="label">Topic layer</text>
  <text x="860" y="272" text-anchor="middle" class="small">sole accepted unit</text>

  <rect x="1005" y="165" width="220" height="60" class="box store"/>
  <text x="1115" y="191" text-anchor="middle" class="label">Graph</text>
  <text x="1115" y="214" text-anchor="middle" class="small">scopes · routes · IDs only</text>
  <rect x="1005" y="245" width="220" height="60" class="box store"/>
  <text x="1115" y="271" text-anchor="middle" class="label">Vector</text>
  <text x="1115" y="294" text-anchor="middle" class="small">permitted evidence content</text>

  <rect x="1275" y="180" width="220" height="105" class="box service"/>
  <text x="1385" y="220" text-anchor="middle" class="label">Agent context</text><text x="1385" y="248" text-anchor="middle" class="label">service</text>
  <text x="1385" y="272" text-anchor="middle" class="small">coverage under budget</text>

  <rect x="1335" y="380" width="180" height="90" class="box agent"/>
  <text x="1425" y="420" text-anchor="middle" class="label">AI agents</text><text x="1425" y="448" text-anchor="middle" class="small">consumer</text>

  <path d="M235 232 H285 M475 232 H525 M715 232 H765 M955 232 H985 Q1005 232 1005 195 M1225 275 H1275 M1385 285 V380" class="line"/>
  <path d="M1115 225 V245" class="line"/>

  <rect x="825" y="390" width="300" height="115" class="box authority"/>
  <text x="975" y="428" text-anchor="middle" class="label">Authoritative systems</text><text x="975" y="456" text-anchor="middle" class="label">of record</text><text x="975" y="482" text-anchor="middle" class="small">facts + instance IDs</text>
  <path d="M1275 420 H1190 Q1160 420 1125 435" class="line"/>
  <text x="1200" y="402" text-anchor="middle" class="note">ECS routing/context</text>
  <path d="M1125 470 H1210 Q1280 470 1335 445" class="line"/>
  <text x="1235" y="505" text-anchor="middle" class="note">owned facts come from source</text>
  <text x="1150" y="535" text-anchor="middle" class="note">agent may read the authoritative owner directly</text>

  <rect x="470" y="590" width="660" height="70" class="box store"/>
  <text x="800" y="620" text-anchor="middle" class="label">Governed feedback to capture (accepted)</text><text x="800" y="646" text-anchor="middle" class="small">assumptions · corrections · actions · write-backs · outcomes</text>
  <path d="M1425 470 V570 H620 V285" class="line"/>
  <text x="1050" y="575" class="note">observable feedback only; no private chain-of-thought</text>

  <rect x="470" y="710" width="500" height="95" class="box candidate"/>
  <text x="720" y="740" text-anchor="middle" class="label">OperationalEpisode (candidate)</text>
  <text x="720" y="765" text-anchor="middle" class="small">not accepted Phase 1 contract</text>
  <text x="720" y="788" text-anchor="middle" class="note">future authority decision and ADR required</text>
  <rect x="1000" y="710" width="500" height="95" class="box candidate"/>
  <text x="1250" y="740" text-anchor="middle" class="label">DecisionEpisode (candidate)</text>
  <text x="1250" y="765" text-anchor="middle" class="small">not accepted Phase 1 contract</text>
  <text x="1250" y="788" text-anchor="middle" class="note">future authority decision and ADR required</text>

  <rect x="55" y="360" width="620" height="110" class="box authority"/>
  <text x="365" y="397" text-anchor="middle" class="label">Governance across every stage</text>
  <text x="365" y="426" text-anchor="middle" class="small">identity / ACL · provenance · authority · temporal validity</text>
  <text x="365" y="452" text-anchor="middle" class="small">retention / deletion / privacy · human validation · observability</text>
</svg>
